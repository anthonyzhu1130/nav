name: Build web
on:
  push:
    branches:
      - master
      - main

# 强制 Action 使用 Node 24（虽然替换了 pnpm/action-setup，加上这句能保证其他隐藏的 Action 也正常）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set Node.js
        uses: actions/setup-node@v4 # v5 如果报错找不到，可以用 v4，v4 也兼容
        with:
          node-version: 22.x
          cache: 'pnpm' # 建议加上，可以缓存依赖，加快后续构建

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10 --activate

      - name: Install
        run: |
          pnpm install

      # dist/404.html: gh-pages history mode
      - name: Build
        run: |
          npm run build-gh-pages
          cp dist/browser/index.html dist/browser/404.html

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: dist/browser
