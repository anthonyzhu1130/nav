name: Build web
on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 1. 先启用 corepack，让 pnpm 进入环境变量
      - name: Enable Corepack
        run: corepack enable

      # 2. 再配置 Node.js 环境
      - name: Set Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'pnpm' # 现在可以安全地使用 pnpm 缓存了

      # 3. 激活指定版本的 pnpm
      - name: Prepare pnpm
        run: corepack prepare pnpm@10 --activate

      - name: Install
        run: |
          pnpm install

      # dist/404.html: gh-pages history mode
      - name: Build
        run: |
          npm run build-gh-pages
          cp dist/browser/index.html dist/browser/404.html

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: dist/browser
